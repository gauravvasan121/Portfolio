    </g>
    <line x1="0" y1="128" x2="330" y2="128" stroke="rgba(215,30,43,0.45)"/>
    <!-- ticks -->
    <g stroke="rgba(233,237,245,0.18)">
      <line x1="0" y1="20" x2="0" y2="128"/><line x1="80" y1="20" x2="80" y2="128"/><line x1="160" y1="20" x2="160" y2="128"/><line x1="240" y1="20" x2="240" y2="128"/><line x1="320" y1="20" x2="320" y2="128"/>
    </g>
  </g>
  <!-- json pane -->
  <g transform="translate(70,270)">
    <rect width="660" height="96" fill="#0a0e16" stroke="rgba(215,30,43,0.4)"/>
    <text x="12" y="18" fill="#d71e2b" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">JSON STREAM  →  REACTIVE UI</text>
    <text x="12" y="40" fill="#e9edf5" font-family="ui-monospace, monospace" font-size="11">{ "stars": 42, "forks": 11, "commits": 318, "src": "GitHub API" }</text>
    <text x="12" y="60" fill="#8c92a4" font-family="ui-monospace, monospace" font-size="11">GET /repos/:owner/:repo  ·  Matplotlib figure  ·  React bind</text>
    <text x="12" y="80" fill="#8c92a4" font-family="ui-monospace, monospace" font-size="11">FLASK  ·  PYTHON  ·  REACT</text>
  </g>

  <!-- footer -->
  <rect x="40" y="384" width="720" height="14" fill="#0a0e16" stroke="rgba(215,30,43,0.25)"/>
  <rect x="40" y="384" width="90" height="14" fill="#d71e2b"/>
  <text x="85" y="394" fill="#e9edf5" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" font-weight="700">LIVE FEED</text>
