    <text x="84" y="102" fill="#e9edf5" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">11</text>
    <text x="154" y="32" fill="#d71e2b" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">318</text>
    <!-- axis -->
    <line x1="0" y1="128" x2="180" y2="128" stroke="#d71e2b" stroke-width="1.2"/>
  </g>
  <!-- sparkline -->
  <g transform="translate(300,86)">
    <text x="0" y="0" fill="#8c92a4" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">COMMIT SPARK</text>
    <polyline fill="none" stroke="#d71e2b" stroke-width="2" points="0,110 40,96 80,102 120,70 160,78 200,48 240,56 280,30 320,42"/>
    <g fill="#d71e2b">
