  <g stroke="rgba(233,237,245,0.05)" stroke-width="1">
    <line x1="40" y1="70" x2="760" y2="70"/><line x1="40" y1="92" x2="760" y2="92"/><line x1="40" y1="114" x2="760" y2="114"/><line x1="40" y1="136" x2="760" y2="136"/><line x1="40" y1="158" x2="760" y2="158"/><line x1="40" y1="180" x2="760" y2="180"/><line x1="40" y1="202" x2="760" y2="202"/><line x1="40" y1="224" x2="760" y2="224"/><line x1="40" y1="246" x2="760" y2="246"/><line x1="40" y1="268" x2="760" y2="268"/><line x1="40" y1="290" x2="760" y2="290"/><line x1="40" y1="312" x2="760" y2="312"/><line x1="40" y1="334" x2="760" y2="334"/><line x1="40" y1="356" x2="760" y2="356"/><line x1="40" y1="378" x2="760" y2="378"/>
    <line x1="48" y1="64" x2="48" y2="388"/><line x1="76" y1="64" x2="76" y2="388"/><line x1="104" y1="64" x2="104" y2="388"/><line x1="132" y1="64" x2="132" y2="388"/><line x1="160" y1="64" x2="160" y2="388"/><line x1="188" y1="64" x2="188" y2="388"/><line x1="216" y1="64" x2="216" y2="388"/><line x1="244" y1="64" x2="244" y2="388"/><line x1="272" y1="64" x2="272" y2="388"/><line x1="300" y1="64" x2="300" y2="388"/><line x1="328" y1="64" x2="328" y2="388"/><line x1="356" y1="64" x2="356" y2="388"/><line x1="384" y1="64" x2="384" y2="388"/><line x1="412" y1="64" x2="412" y2="388"/><line x1="440" y1="64" x2="440" y2="388"/><line x1="468" y1="64" x2="468" y2="388"/><line x1="496" y1="64" x2="496" y2="388"/><line x1="524" y1="64" x2="524" y2="388"/><line x1="552" y1="64" x2="552" y2="388"/><line x1="580" y1="64" x2="580" y2="388"/><line x1="608" y1="64" x2="608" y2="388"/><line x1="636" y1="64" x2="636" y2="388"/><line x1="664" y1="64" x2="664" y2="388"/><line x1="692" y1="64" x2="692" y2="388"/><line x1="720" y1="64" x2="720" y2="388"/><line x1="748" y1="64" x2="748" y2="388"/>
