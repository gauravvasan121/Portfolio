<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="GITHUB VIZ">
  <rect width="800" height="420" fill="#06080c"/>
  <rect x="10" y="10" width="780" height="400" fill="none" stroke="rgba(215,30,43,0.28)" stroke-width="1"/>
  <!-- L-brackets -->
  <path d="M18 18h36M18 18v36" stroke="#d71e2b" stroke-width="2.2" fill="none" stroke-linecap="square"/>
  <path d="M782 18h-36M782 18v36" stroke="#d71e2b" stroke-width="2.2" fill="none" stroke-linecap="square"/>
  <path d="M18 402h36M18 402v-36" stroke="#d71e2b" stroke-width="2.2" fill="none" stroke-linecap="square"/>
  <path d="M782 402h-36M782 402v-36" stroke="#d71e2b" stroke-width="2.2" fill="none" stroke-linecap="square"/>
